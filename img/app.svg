<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#0082c9"/>
      <stop offset="100%" stop-color="#004e92"/>
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="30%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0082c9"/>
    </linearGradient>
    <linearGradient id="innerShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Shield Glow / Border -->
  <path d="M256 32 L416 96 C416 288 320 416 256 464 C192 416 96 288 96 96 Z"
        fill="url(#shieldBorder)" filter="url(#glow)"/>

  <!-- Inner Dark Shield -->
  <path d="M256 48 L396 106 C396 274 310 392 256 440 C202 392 116 274 116 106 Z"
        fill="url(#innerShield)"/>

  <!-- Document Outline with Folded Corner -->
  <path d="M200 160 L288 160 L328 200 L328 352 L200 352 Z"
        fill="none" stroke="url(#shieldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Folded Corner Flap -->
  <path d="M288 160 L288 200 L328 200"
        fill="none" stroke="url(#shieldGrad)" stroke-width="12" stroke-linejoin="round"/>

  <!-- Security Padlock Body -->
  <rect x="232" y="244" width="64" height="52" rx="8"
        fill="url(#shieldGrad)" />
  <!-- Padlock Shackle -->
  <path d="M244 244 V224 C244 210.7 254.7 200 268 200 C281.3 200 292 210.7 292 224 V244"
        fill="none" stroke="url(#shieldGrad)" stroke-width="10" stroke-linecap="round"/>
  <!-- Keyhole -->
  <circle cx="264" cy="266" r="5" fill="#0a192f"/>
  <path d="M264 269 V278" stroke="#0a192f" stroke-width="4" stroke-linecap="round"/>

  <!-- Document Lines -->
  <line x1="224" y1="316" x2="288" y2="316" stroke="url(#shieldGrad)" stroke-width="8" stroke-linecap="round"/>
</svg>
